<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>Sistema de Toma de Inventarios</title>
    <style>
        * {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .fondo {
            background-color: #f5f5f5;
            border-radius: 10px 10px 0px 0px;
            border: 1px solid #d3cfcf;
        }

        .link-site {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
        }

        .autorizar {
            background: #49a50c;
            margin: 0px;
            padding: 13px;
            text-align: center;
            border-radius: 5px;
        }

        .rechazar {
            background: #bf0b1a;
            margin: 0px;
            padding: 13px;
            text-align: center;
            border-radius: 5px;
        }

        .link-action {
            color: #fff;
        }

        .link-activar {
            color: #ff671f;
        }

        #footer {
            background-color: #262626;
            color: white;
            height: 100px;
            padding: 10px 0px 10px 0px;
        }
    </style>
</head>
<body style="margin:0;padding:0;">
    <table role="presentation" style="width:100%;border-collapse:collapse;border:0;border-spacing:0;background:#ffffff;">
        <tr>
            <td align="center" style="padding:0px;">
                <br />
                <br />
                <table role="presentation" style="width:602px; border:1px solid #cccccc; border-radius: 10px 10px 0 0; border-spacing:0; text-align:left;">
                    <tr>
                        <td align="center" style="padding:40px 10px 30px 10px;">
                            <h2 style="color: #0a59c6">Hola {Nombre}</h2>
                            <h4>Tu password es: {Password}</h4>
                            <br />                            
                        </td>
                    </tr>
                    <tr style="background-color: #262626; color: #ffffff; height: 100px;">
                        <td style="padding: 10px;">
                            <span style="font-size: 12px;">Este mensaje fue generado de forma automatica por el Sistema de Toma de Inventarios, favor de no responder.</span>
                            <br />
                            <span style="font-size: 12px; color: #000;">
                                <a href="{urlSitio}" class="link-site">Ir al sitio</a>
                            </span>
                            <br /><br />
                            <span>© Copyright | Sistema de Toma de Inventarios</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
